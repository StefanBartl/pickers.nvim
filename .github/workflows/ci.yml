name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass. docs/BINDINGS.lua is excluded from stylua
  # (aligned reference data, see .styluaignore).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua plugin TESTS

  # Real gate: the framework-free unit suite. lib.nvim is checked out as a
  # sibling so the command.complete tests run too (they need lib.nvim.notify).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout pickers.nvim
        uses: actions/checkout@v5
        with:
          path: pickers.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run tests
        working-directory: pickers.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n -i NONE -l TESTS/pickers_spec.lua
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore

  # Publishes the commit that just passed every gate above as the
  # `ci-verified` branch. Consumer repos pin their dependency checkout to it
  # (ref: ci-verified) so a broken push here cannot turn their CI red.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: git push origin HEAD:refs/heads/ci-verified --force
